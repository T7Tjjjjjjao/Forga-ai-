<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- تدرجات للشعار ثلاثي الأبعاد -->
    <radialGradient id="sphereGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff6666"/>
      <stop offset="40%" stop-color="#ff0000"/>
      <stop offset="70%" stop-color="#990000"/>
      <stop offset="100%" stop-color="#330000"/>
    </radialGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="shadow3d">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- الكرة ثلاثية الأبعاد -->
  <circle cx="50" cy="50" r="45" fill="url(#sphereGrad)" filter="url(#shadow3d)"/>
  
  <!-- اللمعان (Shine) -->
  <ellipse cx="35" cy="30" rx="25" ry="15" fill="url(#shineGrad)" transform="rotate(-30, 35, 30)"/>
  
  <!-- إطار خارجي -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#ff4444" stroke-width="1.5" opacity="0.3"/>
  
  <!-- خطوط داخلية (خطوط حمراء وسوداء) -->
  <!-- خطوط سوداء -->
  <line x1="20" y1="50" x2="80" y2="50" stroke="#1a1a1a" stroke-width="2" opacity="0.6"/>
  <line x1="35" y1="25" x2="65" y2="75" stroke="#1a1a1a" stroke-width="2" opacity="0.6"/>
  <line x1="65" y1="25" x2="35" y2="75" stroke="#1a1a1a" stroke-width="2" opacity="0.6"/>
  
  <!-- خطوط حمراء -->
  <line x1="25" y1="35" x2="75" y2="35" stroke="#ff0000" stroke-width="2" opacity="0.5"/>
  <line x1="25" y1="65" x2="75" y2="65" stroke="#ff0000" stroke-width="2" opacity="0.5"/>
  
  <!-- مركز الشعار -->
  <circle cx="50" cy="50" r="6" fill="#ff4444" opacity="0.8"/>
  <circle cx="50" cy="50" r="3" fill="#1a1a1a"/>
  
  <!-- نقش (Forga) -->
  <text x="50" y="92" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#888" letter-spacing="2">
    FORGA
  </text>
</svg>
